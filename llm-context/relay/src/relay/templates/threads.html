<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay</title>
<style>
:root{--bg:#ffffff;--fg:#18181b;--muted:#71717a;--panel:#fafafa;--line:#e4e4e7;--soft:#f4f4f5;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--live:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0d;--fg:#f4f4f5;--muted:#a1a1aa;--panel:#151518;--line:#2a2a30;--soft:#1d1d22;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--live:#60a5fa}}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif}
main{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-size:18px;margin:0 0 4px}
.muted{color:var(--muted)}.small{font-size:12px}
a.card{display:flex;flex-direction:column;gap:8px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:inherit;text-decoration:none}
a.card:hover{background:var(--soft)}
a.card:focus-visible{outline:2px solid var(--live);outline-offset:2px}
.top{display:flex;gap:8px 12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
</style>
</head>
<body>
<main><div><h1>Relay</h1><div class="muted small" id="summary">Loading…</div></div><div id="rows" style="display:contents"></div></main>
<script>
const BOOT = /*BOOT*/null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const STATUS = { needs_input: ["Needs you", "var(--warn)"], blocked: ["Blocked", "var(--bad)"], running: ["Running", "var(--live)"],
                 quiet: ["Quiet", "var(--muted)"], done: ["Done", "var(--ok)"] };
function ago(iso) {
  if (!iso) return "no updates yet";
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  return s < 60 ? "just now" : s < 3600 ? `${Math.floor(s / 60)} min ago` : `${Math.floor(s / 3600)} h ago`;
}
async function refresh() {
  let rows;
  try { rows = await (await fetch(`${BOOT.base}/threads?t=${BOOT.token}`)).json(); }
  catch { document.getElementById("summary").textContent = "Relay is not running."; return; }
  const waiting = rows.filter(r => r.status === "needs_input").length;
  // The count in the tab title is the signal for a thread that needs the user.
  document.title = waiting ? `(${waiting}) Relay` : "Relay";
  document.getElementById("summary").textContent = rows.length
    ? `${rows.length} thread${rows.length === 1 ? "" : "s"}${waiting ? ` · ${waiting} waiting for you` : ""}` : "No threads yet.";
  document.getElementById("rows").innerHTML = rows.map(r => { const [label, c] = STATUS[r.status];
    return `<a class="card" href="${BOOT.base}/view?thread=${encodeURIComponent(r.thread)}&t=${BOOT.token}">
      <div class="top"><b>${esc(r.title)}</b><span class="pill" style="--c:${c}"><span class="dot"></span>${label}</span></div>
      ${r.question ? `<div>Waiting for you: ${esc(r.question)}</div>` : ""}
      ${r.total ? `<div class="bar" aria-hidden="true"><i style="width:${100 * r.done / r.total}%"></i></div>` : ""}
      <div class="muted small">${r.total ? `${r.done} of ${r.total} tasks done` : "No tasks"}${r.failed ? ` · ${r.failed} failed` : ""} · ${ago(r.updated)}</div></a>`;
  }).join("");
}
refresh();
setInterval(refresh, 3000);  // one page polling is cheap, and it holds no connection open
</script>
</body>
</html>
