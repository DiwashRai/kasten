[project]
name = "relay"
version = "0.1.0"
description = "Live status pages and input forms for agent threads in T3 Code."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
relay = "relay.main_io:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay"]
